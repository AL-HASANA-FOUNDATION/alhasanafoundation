img,svg,video{max-width:100%;height:auto}
.wrap{width:100%}
@media (max-width:560px){
  .wrap{padding-left:12px!important;padding-right:12px!important}
  .hero{padding:22px 16px!important}
  .hero h1{font-size:1.55rem!important}
  .card{padding:14px!important}
  .topphoto img{border-radius:12px!important}
}
@media (min-width:561px) and (max-width:899px){
  .wrap{max-width:100%!important;padding-left:20px!important;padding-right:20px!important}
  .hero{padding:32px 24px!important}
}
@media (min-width:900px){
  .wrap{max-width:1280px!important;padding-left:28px!important;padding-right:28px!important}
  .hero{padding:44px 36px!important}

  .committee-grid{grid-template-columns:repeat(3,1fr)!important}

}

}
@media (min-width:1600px){

}
@media (min-width:720px){
  nav.tabs{width:100%;max-width:none;justify-content:center}
  .grid2{grid-template-columns:1fr 1fr}
}


/* ---------- Dots menu - logo er left e ---------- */
.top{position:relative}
.dots-btn{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.dots-btn:hover{background:var(--surface);border-color:var(--accent)}
.dots-ic{display:flex;gap:4px;align-items:center;justify-content:center}
.dots-ic i{width:5px;height:5px;border-radius:50%;background:currentColor;display:block}
.dots-menu{position:absolute;right:12px;left:auto;top:calc(100% + 6px);z-index:50;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:8px;overflow:hidden}
.dots-menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 12px;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;border-radius:10px}
.dots-menu button:hover{background:var(--accent-soft)}
.dots-menu button span.ic{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:16px;color:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.12)}.dots-menu button span.ic svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.dots-menu button span.ic.ic-notif{background:#E11D48}.dots-menu button span.ic.ic-about{background:#0B6B3A}.dots-menu button span.ic.ic-goal{background:#D97706}.dots-menu button span.ic.ic-committee{background:#2563EB}.dots-menu button span.ic.ic-admin{background:#7C3AED}.dots-menu button span.ic.ic-donation{background:#DB2777}
@media (max-width:560px){.dots-menu{left:12px;right:12px;min-width:0}}


/* ---------- Committee photo upload - Admin ---------- */
.mem-photo-box{display:flex;align-items:center;gap:12px}
.mem-photo-preview{flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;border:2px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.mem-photo-preview img{width:100%;height:100%;object-fit:cover;display:block}
.mem-photo-preview .avatar{width:100%;height:100%}
.mem-upload-label{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-weight:600;cursor:pointer;font-size:.9rem}
.mem-upload-label:hover{border-color:var(--accent);background:var(--accent-soft)}
.mem-row-photo{flex:none}
.mem-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}


/* ---------- Notification inside Nav Bar ---------- */
nav.tabs{grid-template-columns:repeat(5,1fr)!important}
.tab.nav-bell{position:relative;background:none;border:0;font:inherit;cursor:pointer}
.tab-ic{position:relative;display:grid;place-items:center;line-height:0}
.tab-ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab-ic .badge{position:absolute;top:-7px;right:-11px;min-width:18px;height:18px;padding:0 4px;line-height:18px}
.tab.nav-bell[aria-expanded="true"]{color:var(--accent);font-weight:700}
/* Panel - mobile e nav bar er upore, PC te nav bar er niche */

@media (min-width:720px){
  nav.tabs{grid-template-columns:repeat(5,auto)!important}
  .npanel{top:calc(env(safe-area-inset-top,0px) + 62px)!important;bottom:auto!important;left:auto!important;right:16px!important;width:min(380px,calc(100% - 32px))!important;max-height:min(70vh,520px)}
  .tab.nav-bell{flex-direction:row!important;gap:8px!important;font-size:.92rem!important;padding:10px 14px!important}
}


/* ---------- Notification inside 3 dots ---------- */
.dots-btn{position:relative}
.dots-badge{position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--surface);display:block}
.dots-badge[hidden]{display:none}
.dots-menu button{position:relative}
.dots-menu .badge{position:absolute;right:12px;top:50%;transform:translateY(-50%);min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--bad);color:var(--surface);font-size:.72rem;font-weight:700;line-height:19px;text-align:center}
.dots-menu .badge[hidden]{display:none}


/* ---------- Professional hover - design / color same, sudhu interaction ---------- */
.btn,.tab,.chip,.tcard,.dots-btn,.dots-menu button,.fab-btn,.fab-item,.theme-switch,.mem-upload-label,.toc a,summary,.subtabs .chip{transition:background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease,transform .25s ease}
.tab{position:relative}
.tab::after{content:none!important}
@media (hover:hover) and (pointer:fine){
  /* Buttons - primary theme er ektu garo / ujjol shade */
  .btn:hover{background:var(--surface2);border-color:var(--accent);color:var(--ink);transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--accent-ink);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.10)}
  .btn.danger:hover{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .btn.ghost:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.7)}
  .hero .btn.primary:hover{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
  /* Links */
  a:not(.btn):not(.tab):not(.toc a):hover{color:var(--accent-hover);text-decoration:none}
  /* Nav menu - soft bg + underline */
  .tab:hover{background:var(--accent-soft);color:var(--accent)}
  .tab[aria-current="page"]:hover{background:var(--accent-soft);color:var(--accent)}
  /* Service card - samanno upore + subtle shadow */
  .tcard:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.08);border-color:var(--accent)!important}
  .tcard:hover .tarrow{transform:translateX(2px)}
  .tcard .tarrow{transition:transform .25s ease}
  /* Chips / subtabs */
  .chip:hover,.subtabs .chip:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .chip[aria-pressed="true"]:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--accent-ink)}
  /* Dots menu + header */
  .dots-btn:hover{background:var(--accent-soft);border-color:var(--accent)}
  .dots-menu button:hover{background:var(--accent-soft);color:var(--ink)}
  .theme-switch:hover{border-color:var(--accent)}
  /* Floating Call / WhatsApp */
  .fab-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .fab-item:hover{background:var(--accent-soft)}
  /* TOC / summary / upload */
  .toc a:hover{background:var(--accent-soft)}
  summary:hover{color:var(--accent)}
  .mem-upload-label:hover{background:var(--accent-soft);border-color:var(--accent)}
}
@media (prefers-reduced-motion:reduce){
  .btn,.tab,.chip,.tcard,.dots-btn,.dots-menu button,.fab-btn,.fab-item,.theme-switch,.mem-upload-label,.toc a,summary{transition:none}
  .tab::after{transition:none}
}



/* Home photo - upore menu bar er sathe gradient e misha, ar kichu change kora hoyni */
.topphoto{position:relative;margin-top:-21px}
.topphoto img{border-top-left-radius:0!important;border-top-right-radius:0!important;border-top:0!important}
.topphoto::after{content:"";position:absolute;left:0;right:0;top:0;height:30%;border-radius:0;pointer-events:none;background:linear-gradient(to bottom,var(--surface) 0%,color-mix(in srgb,var(--surface) 62%,transparent) 38%,color-mix(in srgb,var(--surface) 18%,transparent) 68%,transparent 100%)}
@media (max-width:560px){.topphoto{margin-top:-21px}.topphoto::after{height:34%}}

.tab svg,.tab:hover svg{fill:none!important;stroke:currentColor!important;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.dots-menu button span.ic svg{fill:none!important;stroke:#fff!important;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Seba illustration animations ---------- */
.a-awn,.a-coin,.a-sun,.a-sway,.a-heart,.a-door{transform-box:fill-box}
.a-awn{transform-origin:50% 0;animation:aAwn 2.4s ease-in-out infinite}
@keyframes aAwn{0%,100%{transform:skewX(0)}50%{transform:skewX(-4deg)}}
.a-coin{transform-origin:50% 50%;animation:aCoin 1.2s ease-in-out infinite}
@keyframes aCoin{0%,100%{transform:translateY(0) scaleX(1)}25%{transform:translateY(-8px) scaleX(.3)}50%{transform:translateY(-12px) scaleX(1)}75%{transform:translateY(-6px) scaleX(.3)}}
.a-bob{animation:aBob 1.6s ease-in-out infinite}.a-bob.b2{animation-delay:-.8s}
@keyframes aBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.a-sun{transform-origin:50% 50%;animation:aSun 2.5s ease-in-out infinite}
@keyframes aSun{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.a-sway{transform-origin:50% 100%;animation:aSway 2.2s ease-in-out infinite}
@keyframes aSway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.a-bounce{animation:aBounce .5s ease-in-out infinite}
@keyframes aBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.a-wheel{animation:aSpin .9s linear infinite}
@keyframes aSpin{to{transform:rotate(360deg)}}
.a-road{animation:aRoad .6s linear infinite}
@keyframes aRoad{to{stroke-dashoffset:24}}
.a-heart{transform-origin:50% 50%;animation:aHeart 1.2s ease-in-out infinite}
@keyframes aHeart{0%,100%{transform:scale(1)}20%{transform:scale(1.25)}40%{transform:scale(1)}60%{transform:scale(1.18)}}
.a-win{animation:aWin 2.4s ease-in-out infinite}.a-win.w2{animation-delay:-1.2s}
@keyframes aWin{0%,100%{fill:var(--accent-soft)}50%{fill:#E8B83A}}
.a-door{transform-origin:0 50%;animation:aDoor 3s ease-in-out infinite}
@keyframes aDoor{0%,70%,100%{transform:scaleX(1)}80%,90%{transform:scaleX(.7)}}
@media (prefers-reduced-motion:reduce){.timg svg *{animation:none!important}}

function bn(s){if(s==null)return '';if(typeof s==='number'&&isNaN(s))return '';var _s=String(s);if(_s==='NaN'||_s==='undefined')return '';return _s.replace(/[\u09E6-\u09EF]/g,function(d){return String(d.charCodeAt(0)-0x09E6);});}

function initSig(){
  var c=document.getElementById('sig');if(!c)return;
  var r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1,ctx=c.getContext('2d');
  c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);ctx.scale(dpr,dpr);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);
  ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
  if(draft.sig){var img=new Image();img.onload=function(){ctx.drawImage(img,0,0,r.width,r.height);};img.src=draft.sig;}
  var drawing=false,last=null;
  function pos(e){var b=c.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top};}
  c.addEventListener('pointerdown',function(e){drawing=true;try{c.setPointerCapture(e.pointerId);}catch(x){}last=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.1,last.y+.1);ctx.stroke();e.preventDefault();});
  c.addEventListener('pointermove',function(e){if(!drawing)return;var q=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();last=q;e.preventDefault();});
  function end(){if(!drawing)return;drawing=false;draft.sig=c.toDataURL('image/png');if(errs.sig){delete errs.sig;var er=c.parentNode.parentNode.querySelector('.err');if(er)er.remove();}}
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}

function propBox(a){

function readMemPhoto(file,cb){
  if(!file){cb('');return;}
  if(file.type && file.type.indexOf('image/')!==0){toast('ছবি ফাইল দিন।');cb('');return;}
  var rd=new FileReader();
  rd.onerror=function(){toast('ছবি পড়া যায়নি। অন্য ছবি দিন।',5000);cb('');};
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      try{
        var max=360;var w=img.width,h=img.height;if(w>max||h>max){var sc=Math.min(max/w,max/h);w=Math.round(w*sc);h=Math.round(h*sc);}
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
        var q=0.82,out=cv.toDataURL('image/jpeg',q);
        while(out.length>250000&&q>0.4){q-=0.1;out=cv.toDataURL('image/jpeg',q);}
        cb(out);
      }catch(e){toast('ছবি ছোট করা যায়নি। অন্য ছবি দিন।',5000);cb('');}
    };
    img.onerror=function(){toast('এই ছবির ফরম্যাট চলছে না (JPG বা PNG দিন)।',6000);cb('');};
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

function initDb(){

  var timer=setTimeout(function(){if(dbState==='loading'){dbState='slow';updNotif();}},10000);
  Promise.all([c.use('db'),c.use('user')]).then(function(r){
    var db=r[0],u=r[1];
    if(!db){clearTimeout(timer);useLocal();updNotif();return;}
    dbRef=db;
    if(u){u.canEdit().then(function(v){canPost=!!v;if(route==='admin'&&authed&&adminTab==='notif')render();});}
    db.collection('notifications').orderBy('createdAt','desc').limit(50).onSnapshot(function(snap){
      clearTimeout(timer);dbState='ok';
      notifs=snap.docs.map(function(d){var x=d.data()||{};return {id:d.id,title:String(x.title||''),body:String(x.body||''),at:Number(x.createdAt)||0};});

      if(panelOpen){seenAt=Date.now();saveSeen();}

      if(route==='admin'&&authed&&adminTab==='notif'&&!(ae&&ae.closest&&ae.closest('[data-form="nsend"]')))render();

function slideTo(i,smooth){
  var c=document.getElementById('slides');if(!c||!c.children[i])return;
  var k=c.children[i];c.scrollTo({left:k.offsetLeft-(c.clientWidth-k.offsetWidth)/2,behavior:smooth?'smooth':'auto'});
}
function curSlide(c){
  var mid=c.scrollLeft+c.clientWidth/2,best=0,bd=1e9;
  for(var i=0;i<c.children.length;i++){var k=c.children[i],d=Math.abs(k.offsetLeft+k.offsetWidth/2-mid);if(d<bd){bd=d;best=i;}}
  return best;
}
function updSlideCount(c){var el=document.getElementById('sl-count');if(el)el.textContent=bn(curSlide(c)+1)+' / '+bn(c.children.length);}
var homeSliderTimer=null;
function initHomeSlider(){
  var slider=document.getElementById('homeSlider');if(!slider)return;
  var track=document.getElementById('homeSliderTrack');if(!track)return;
  var slides=slider.querySelectorAll('.home-slide');
  var dots=slider.querySelectorAll('.home-dot');
  var idx=0;var total=2;
  function goTo(i,animate){
    idx=((i%total)+total)%total;
    slides.forEach(function(sl,j){
      if(!animate)sl.style.transition='none';else sl.style.transition='';
      sl.classList.toggle('active',j===idx);
      if(!animate){void sl.offsetWidth;sl.style.transition='';}
    });
    dots.forEach(function(d,j){d.classList.toggle('active',j===idx);});
  }
  function stopAuto(){if(homeSliderTimer){clearInterval(homeSliderTimer);homeSliderTimer=null;}}
  function startAuto(){stopAuto();homeSliderTimer=setInterval(function(){goTo(idx+1,true);},2500);}
  var prevBtn=slider.querySelector('.home-slider-arrow.prev');
  var nextBtn=slider.querySelector('.home-slider-arrow.next');
  if(prevBtn)prevBtn.addEventListener('click',function(){goTo(idx-1,true);startAuto();});
  if(nextBtn)nextBtn.addEventListener('click',function(){goTo(idx+1,true);startAuto();});
  dots.forEach(function(d,j){d.addEventListener('click',function(){goTo(j,true);startAuto();});});
  var startX=0;var dragging=false;
  track.addEventListener('touchstart',function(e){startX=e.touches[0].clientX;dragging=true;stopAuto();},{passive:true});
  track.addEventListener('touchend',function(e){if(!dragging)return;dragging=false;var dx=e.changedTouches[0].clientX-startX;if(dx<-40)goTo(idx+1,true);else if(dx>40)goTo(idx-1,true);startAuto();},{passive:true});
  slider.addEventListener('mouseenter',stopAuto);
  slider.addEventListener('mouseleave',startAuto);
  goTo(0,false);startAuto();
}
function initSlides(){
  var c=document.getElementById('slides');if(!c)return;
  var f=c.getAttribute('data-first');slideTo(Number(f)||0,false);updSlideCount(c);
}

/* "NaN" শুধু দেখানো লেখা ও ঘরের মান থেকে মুছবে। ছবির কোড (src) ছোঁবে না। */
function stripNaN(root){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n,list=[];
  while((n=w.nextNode())){if(n.nodeValue.indexOf('NaN')!==-1)list.push(n);}
  list.forEach(function(t){t.nodeValue=t.nodeValue.replace(/NaN/g,'');});
  root.querySelectorAll('[value]').forEach(function(e){var v=e.getAttribute('value');if(v&&v.indexOf('NaN')!==-1){e.setAttribute('value',v.replace(/NaN/g,''));if('value' in e&&String(e.value).indexOf('NaN')!==-1)e.value=String(e.value).replace(/NaN/g,'');}});
}

var FB_VER='10.12.2';
var fbAdminErr='',fbAdminEm='';
function sj(o){if(o===null||typeof o!=='object')return JSON.stringify(o);if(Array.isArray(o))return '['+o.map(sj).join(',')+']';return '{'+Object.keys(o).sort().map(function(k){return JSON.stringify(k)+':'+sj(o[k]);}).join(',')+'}';}
function numId(x){return parseInt(String(x.id).replace(/\D/g,''),10)||0;}
function fbMsg(e){var c=(e&&e.code)||'';if(c==='permission-denied')return 'অনুমতি নেই';if(c==='unavailable'||c==='auth/network-request-failed')return 'ইন্টারনেট নেই';return c||'ত্রুটি';}
function fbAuthMsg(e){
  var c=(e&&e.code)||'';
  if(c==='auth/invalid-credential'||c==='auth/user-not-found'||c==='auth/wrong-password'||c==='auth/invalid-login-credentials')return 'নম্বর বা পাসওয়ার্ড ঠিক নয়।';
  if(c==='auth/email-already-in-use')return 'এই নম্বরে আগেই অ্যাকাউন্ট খোলা আছে। লগইন করুন।';
  if(c==='auth/weak-password')return 'পাসওয়ার্ড আরও শক্ত দিন (কমপক্ষে ৬ অক্ষর)।';
  if(c==='auth/network-request-failed')return 'ইন্টারনেট সংযোগ নেই। আবার চেষ্টা করুন।';
  if(c==='auth/too-many-requests')return 'অনেকবার ভুল হয়েছে। কিছুক্ষণ পরে চেষ্টা করুন।';
  if(c==='auth/operation-not-allowed')return 'Firebase-এ Email/Password লগইন চালু করা হয়নি।';
  if(c==='auth/invalid-email')return 'ইমেইল সঠিক নয়।';
  return 'সমস্যা হয়েছে ('+c+')।';
}

function fbRender(){

function fbWatch(list,col,q,cb){
  list.push(q.onSnapshot(function(snap){
    var arr=[],sent={};
    snap.docs.forEach(function(d){var x=d.data()||{};x.id=d.id;arr.push(x);sent[d.id]=sj(x);});
    FB.sent[col]=sent;FB.loaded[col]=true;cb(arr);fbRender();
  },function(e){toast('ডাটা আনা যায়নি ('+col+'): '+fbMsg(e));}));
}
function fbDetach(){
  FB.unsubs.forEach(function(f){try{f();}catch(e){}});FB.unsubs=[];
  ['apps','loans','donations','nasihats','admins','history'].forEach(function(c){FB.sent[c]={};FB.loaded[c]=false;});
}

    clearTimeout(timer);dbState='ok';
    notifs=snap.docs.map(function(d){var x=d.data()||{};return {id:d.id,title:String(x.title||''),body:String(x.body||''),at:Number(x.createdAt)||0};});
    if(!firstSnap){snap.docChanges().forEach(function(ch){if(ch.type==='added'){var x=ch.doc.data()||{};if(Number(x.createdAt)>seenAt&&!panelOpen)toast('নতুন নোটিফিকেশন: '+String(x.title||''));}});}

/* ডাটা বদলালে শুধু বদলানো অংশ ক্লাউডে লেখা হয় */
function fbSave(){
  if(!FB.on||!FB.uid)return;
  function push(col,arr,canDel){
    if(!FB.loaded[col]){toast('ডাটা লোড হচ্ছে। একটু পরে আবার চেষ্টা করুন।');return;}
    var sent=FB.sent[col]||(FB.sent[col]={}),seen={};
    arr.forEach(function(it){
      seen[it.id]=1;
      var o=JSON.parse(JSON.stringify(it)),j=sj(o);
      if(sent[it.id]!==j){sent[it.id]=j;FB.db.collection(col).doc(it.id).set(o).then(function(){if(col==='committee')toast('✔ কমিটির তথ্য সার্ভারে সেভ হয়েছে');}).catch(function(e){delete sent[it.id];toast('সেভ হয়নি ('+col+'): '+fbMsg(e),8000);});}
    });
    if(canDel)Object.keys(sent).forEach(function(id){if(!seen[id]){delete sent[id];FB.db.collection(col).doc(id).delete().catch(function(e){toast('মোছা যায়নি: '+fbMsg(e));});}});
  }
  if(FB.isAdmin){
    push('committee',S.committee,true);
    push('apps',S.apps,false);
    push('loans',S.loans,false);
    push('donations',S.donations,true);
    push('nasihats',S.nasihats,true);
    push('admins',S.admins,true);
    push('history',S.history.slice(0,100),true);
    if(FB.loaded.loans){
      var ben=S.loans.map(function(l){return {id:l.id,name:l.consent?l.name:'',amount:l.amount,disbursed:l.disbursed,consent:!!l.consent};});
      var sentB=FB.sent.beneficiaries||(FB.sent.beneficiaries={}),seenB={};
      ben.forEach(function(b){seenB[b.id]=1;var j=sj(b);if(sentB[b.id]!==j){sentB[b.id]=j;FB.db.collection('beneficiaries').doc(b.id).set(b).catch(function(e){delete sentB[b.id];toast('সেভ হয়নি: '+fbMsg(e));});}});
      Object.keys(sentB).forEach(function(id){if(!seenB[id]){delete sentB[id];FB.db.collection('beneficiaries').doc(id).delete().catch(function(){});}});
    }
  }else{
    var sentA=FB.sent.apps||(FB.sent.apps={});
    S.apps.forEach(function(a){
      if(a.uid!==FB.uid||sentA[a.id])return;
      var o=JSON.parse(JSON.stringify(a));sentA[a.id]=sj(o);
      FB.db.collection('apps').doc(a.id).set(o).catch(function(e){delete sentA[a.id];toast('আবেদন সেভ হয়নি: '+fbMsg(e));});
    });
  }
}

/* ===== FCM Push - Token save + Foreground handle ===== */
function fcmSaveToken(token){
  if(!token) return;
  try{ localStorage.setItem(FCM_TOKEN_KEY, token); }catch(e){}
  if(!FB.db) return;
  // Token টা Firestore এ সেভ হবে, Cloud Function এই token গুলোতে পুশ পাঠাবে
  FB.db.collection('fcmTokens').doc(token).set({
    token: token,
    createdAt: Date.now(),
    updatedAt: Date.now(),
    platform: 'web',
    ua: (navigator.userAgent||'').slice(0,200)
  }, {merge:true}).catch(function(e){ console.log('FCM token save fail', e); });
}
function fcmShowForeground(title, body){
  // অ্যাপ খোলা থাকলে ভিতরে toast + bell badge দেখাবে
  try{ toast(title + (body ? ': ' + body : '')); }catch(e){}
  try{ updNotif(); }catch(e){}
}
function fcmInit(){
  if(!FB.cfg) return;
  if(!('Notification' in window)) return;
  if(!firebase.messaging || !firebase.messaging.isSupported || !firebase.messaging.isSupported()) return;
  try{
    FB.messaging = firebase.messaging();
    // Foreground - অ্যাপ খোলা থাকলে
    FB.messaging.onMessage(function(payload){
      var n = (payload && payload.notification) || {};
      var d = (payload && payload.data) || {};
      var title = n.title || d.title || 'আল হাসানা ফাউন্ডেশন';
      var body = n.body || d.body || '';
      fcmShowForeground(title, body);
      // নতুন notification এলে bell refresh - Firestore listener এমনিতেই আপডেট করবে
    });
    // আগে থেকে permission দেওয়া থাকলে চুপচাপ token নাও
    if(Notification.permission === 'granted'){
      fcmGetToken();
    }
  }catch(e){ console.log('FCM init fail', e); }
}
function fcmGetToken(){
  if(!FB.messaging) return Promise.resolve(null);
  if(!('serviceWorker' in navigator)) return Promise.resolve(null);
  // তোমার আগের sw.js টাই ব্যবহার হবে, আলাদা SW দিয়ে overwrite হবে না
  return navigator.serviceWorker.ready.then(function(reg){
    return FB.messaging.getToken({ vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });
  }).then(function(token){
    if(token) fcmSaveToken(token);
    return token;
  }).catch(function(e){
    console.log('FCM getToken fail', e);
    // SW ready না হলে আবার চেষ্টা - firebase-messaging-sw.js fallback
    return FB.messaging.getToken({ vapidKey: FCM_VAPID_KEY }).then(function(token){
      if(token) fcmSaveToken(token);
      return token;
    }).catch(function(e2){ console.log('FCM getToken 2nd fail', e2); return null; });
  });
}
function fcmRequestPermission(){
  if(!('Notification' in window)){ toast('এই ব্রাউজারে Notification সাপোর্ট করে না।'); return; }
  if(!FB.cfg){ toast('Firebase কনফিগ নেই, তাই Notification চালু করা যাবে না।'); return; }
  if(!FB.messaging){ toast('FCM রেডি হয়নি, ২ সেকেন্ড পরে আবার চেষ্টা করুন।'); return; }
  Notification.requestPermission().then(function(perm){
    if(perm === 'granted'){
      return fcmGetToken().then(function(token){
        if(token){ toast('Notification চালু হয়েছে। এখন থেকে ফোনে পুশ আসবে।'); render(); }
        else toast('Token পাওয়া যায়নি, আবার চেষ্টা করুন।');
      });
    } else if(perm === 'denied'){
      toast('তুমি Notification Block করে দিয়েছো। ব্রাউজার Settings > Site settings > Notifications থেকে Allow করতে হবে।');
    } else {
      toast('Notification অনুমতি দেওয়া হয়নি।');
    }
  });
}
function fcmIsEnabled(){
  try{ return Notification.permission === 'granted' && !!localStorage.getItem(FCM_TOKEN_KEY); }catch(e){ return false; }
}

function fbLoadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

    firebase.initializeApp(FB.cfg);
    FB.auth=firebase.auth();FB.db=firebase.firestore();FB.on=true;dbRef=FB.db;
    watchNotifs();fbWatchPublic();fcmInit();

    (reg?gfield('g-pass2','পাসওয়ার্ড আবার লিখুন','pass2','<input id="g-pass2" data-g="pass2" type="password" autocomplete="new-password" value="'+esc(gs.pass2)+'">','pass2'):'')+
    (gs.err.form?'<p class="err">'+esc(gs.err.form)+'</p>':'')+
    '<button class="btn primary block" type="submit"'+(gs.busy?' disabled':'')+'>'+(gs.busy?'অপেক্ষা করুন…':(reg?'অ্যাকাউন্ট খুলুন':'প্রবেশ করুন'))+'</button>'+
    '<div class="gm-links"><button class="gm-link" type="button" data-a="gfbmode">'+(reg?'আগেই অ্যাকাউন্ট আছে? লগইন':'নতুন অ্যাকাউন্ট')+'</button><button class="gm-link" type="button" data-a="gfbhome">✕ বন্ধ করুন</button></div>'+
    (reg?'':'<p class="small muted">পাসওয়ার্ড ভুলে গেলে কমিটির কাউকে জানান, তাঁরা নতুন পাসওয়ার্ড ঠিক করে দেবেন।</p>')+
    '</form>';
  }
  return '<div class="gate-page">'+head+preview+'</div><div class="gm-back" role="dialog" aria-modal="true"><div class="gm">'+mh+body+'</div></div>';
}
function fbGateSubmit(){
  var reg=gs.mode==='reg';
  function v(id){var e=document.getElementById(id);return e?e.value:'';}
  if(reg)gs.name=v('g-name');
  gs.phone=v('g-phone');gs.pass=v('g-pass');gs.pass2=reg?v('g-pass2'):'';gs.err={};
  var ph=toEn(gs.phone).replace(/[\s-]/g,'');
  if(reg&&gs.name.trim().length<2)gs.err.name='আপনার নাম লিখুন।';
  if(!/^01[3-9]\d{8}$/.test(ph))gs.err.phone='সঠিক মোবাইল নম্বর দিন (যেমন 01712345678)।';
  if(gs.pass.length<6)gs.err.pass='পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।';
  if(reg&&gs.pass2!==gs.pass)gs.err.pass2='দুটি পাসওয়ার্ড মেলেনি।';
  if(Object.keys(gs.err).length){renderGate();return;}
  gs.busy=true;renderGate();
  var em=ph+'@ahf.app',p;
  if(reg){
    var nm=gs.name.trim();
    p=FB.auth.createUserWithEmailAndPassword(em,gs.pass).then(function(c){return c.user.updateProfile({displayName:nm}).then(function(){user.name=nm;if(myLoanAuth)myLoanAuth.name=nm;if(!draft.name)draft.name=nm;});});
  }else p=FB.auth.signInWithEmailAndPassword(em,gs.pass);
  p.then(function(){gs=newGate();render();toast('স্বাগতম');}).catch(function(e){gs.busy=false;gs.err={form:fbAuthMsg(e)};renderGate();});
}

/* ====== জেসচার: (১) পাতা বদলাতে আড়াআড়ি swipe (২) নিচে টেনে রিফ্রেশ (৩) পপআপ নিচে টেনে বন্ধ ====== */
(function(){
  var g=null,ind=null,busy=false;
  function $(id){return document.getElementById(id);}
  function gated(){var e=$('gate');return !!(e&&!e.hidden);}
  function recOpen(){var e=$('receipt-print');return !!(e&&!e.hidden);}
  function anyOverlay(){return !!($('memPop')||typeOpen>=0||panelOpen||recOpen());}
  function kindOf(t){
    var m=$('memPop');if(m&&m.contains(t))return 'mem';
    var s=$('tsheet');if(typeOpen>=0&&s&&!s.hidden&&s.contains(t))return 'sheet';
    return '';
  }
  function hScroll(el){
    while(el&&el!==document.body){
      if(el.nodeType===1){var cs=getComputedStyle(el);if(/(auto|scroll)/.test(cs.overflowX)&&el.scrollWidth>el.clientWidth+2)return true;}
      el=el.parentNode;
    }
    return false;
  }
  function atTop(el){
    while(el&&el!==document.body){
      if(el.nodeType===1){var cs=getComputedStyle(el);if(/(auto|scroll)/.test(cs.overflowY)&&el.scrollHeight>el.clientHeight+2&&el.scrollTop>0)return false;}
      el=el.parentNode;
    }
    return true;
  }
  function isField(el){return !!(el&&el.closest&&el.closest('input,textarea,select,canvas,[contenteditable="true"]'));}
  function tabIndex(){for(var i=0;i<TABS.length;i++)if(TABS[i][0]===route)return i;return -1;}
  function showInd(h,ready){
    if(!ind){ind=document.createElement('div');ind.className='ptr';ind.setAttribute('aria-hidden','true');document.body.appendChild(ind);}
    ind.textContent=ready?'ছেড়ে দিন, রিফ্রেশ হবে':'রিফ্রেশ করতে নিচে টানুন';
    ind.style.transition='none';
    ind.style.transform='translate(-50%,'+(Math.min(h,70)-60)+'px)';
    ind.style.opacity=String(Math.min(1,h/40));
  }
  function hideInd(){if(ind){ind.style.transition='transform .15s,opacity .15s';ind.style.transform='translate(-50%,-80px)';ind.style.opacity='0';}}
  function resetCard(c){if(!c)return;c.style.transition='transform .2s,opacity .2s';c.style.transform='';c.style.opacity='';setTimeout(function(){c.style.transition='';},230);}
  function closeKind(k){
    if(k==='mem'){closeMemPopup();}
    else if(k==='sheet'){typeOpen=-1;renderSheet();}
  }
  document.addEventListener('touchstart',function(e){
    g=null;
    if(busy||e.touches.length!==1||gated())return;
    var p=e.touches[0],t=e.target,k=kindOf(t);
    if(!k&&anyOverlay())return;
    g={x:p.clientX,y:p.clientY,t:Date.now(),el:t,kind:k,dx:0,dy:0,ptr:undefined};
    if(k){
      var root=$(k==='mem'?'memPop':'tsheet'),c=t;
      while(c&&c.parentNode!==root)c=c.parentNode;
      g.card=(c&&c.nodeType===1)?c:null;
      g.top=atTop(t);
    }
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!g||e.touches.length!==1)return;
    var p=e.touches[0];g.dx=p.clientX-g.x;g.dy=p.clientY-g.y;
    if(g.kind){
      if(g.top&&g.card&&g.dy>0&&g.dy>Math.abs(g.dx)){
        g.card.style.transition='none';
        g.card.style.transform='translateY('+g.dy+'px)';
        g.card.style.opacity=String(Math.max(.4,1-g.dy/400));
      }
      return;
    }
    if(g.ptr===undefined){
      if(Math.abs(g.dy)<8&&Math.abs(g.dx)<8)return;
      g.ptr=(g.dy>0&&g.dy>Math.abs(g.dx)*1.2&&(window.scrollY||0)<=0&&route!=='apply'&&route!=='admin'&&!isField(g.el));
    }
    if(g.ptr&&g.dy>0)showInd(g.dy*0.5,g.dy>=120);
  },{passive:true});
  document.addEventListener('touchcancel',function(){
    if(g){if(g.card)resetCard(g.card);if(g.ptr)hideInd();}
    g=null;
  },{passive:true});
  document.addEventListener('touchend',function(){
    if(!g)return;
    var d=g;g=null;
    if(d.kind){
      if(d.top&&d.dy>110&&d.dy>Math.abs(d.dx)*1.5){closeKind(d.kind);if(d.card){d.card.style.transform='';d.card.style.opacity='';}}
      else resetCard(d.card);
      return;
    }
    if(d.ptr){
      hideInd();
      if(d.dy>=120){busy=true;showInd(70,true);ind.textContent='রিফ্রেশ হচ্ছে…';ind.style.opacity='1';setTimeout(function(){location.reload();},150);}
      return;
    }
    var ti=tabIndex();
    if(ti<0||Date.now()-d.t>800)return;
    if(Math.abs(d.dx)<80||Math.abs(d.dx)<Math.abs(d.dy)*2)return;
    if(isField(d.el)||hScroll(d.el)||(d.el.closest&&d.el.closest('#homeSlider,#slides,.tbl,.subtabs')))return;
    var ni=d.dx<0?ti+1:ti-1;
    if(ni<0||ni>=TABS.length)return;
    var a=document.querySelector('#nav a.tab[href="#'+TABS[ni][0]+'"]');
    if(a)a.click();
  },{passive:true});
})();
})();
</script>
