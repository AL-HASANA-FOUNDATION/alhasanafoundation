/* ---------- Dots menu - logo er left e ---------- */
.top{position:relative}
.dots-btn{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.dots-btn:hover{background:var(--surface);border-color:var(--accent)}
.dots-ic{display:flex;gap:4px;align-items:center;justify-content:center}
.dots-ic i{width:5px;height:5px;border-radius:50%;background:currentColor;display:block}
.dots-menu{position:absolute;right:12px;left:auto;top:calc(100% + 6px);z-index:50;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:8px;overflow:hidden}
.dots-menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 12px;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;border-radius:10px}
.dots-menu button:hover{background:var(--accent-soft)}
.dots-menu button span.ic{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--surface2);border:1px solid var(--line)}
@media (max-width:560px){.dots-menu{left:12px;right:12px;min-width:0}}


/* ---------- Committee photo upload - Admin ---------- */
.mem-photo-box{display:flex;align-items:center;gap:12px}
.mem-photo-preview{flex:none;width:64px;height:64px;border-radius:50%;overflow:hidden;border:2px solid var(--line);background:var(--surface2);display:grid;place-items:center}
.mem-photo-preview img{width:100%;height:100%;object-fit:cover;display:block}
.mem-photo-preview .avatar{width:100%;height:100%}
.mem-upload-label{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-weight:600;cursor:pointer;font-size:.9rem}
.mem-upload-label:hover{border-color:var(--accent);background:var(--accent-soft)}
.mem-row-photo{flex:none}
.mem-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}


/* ---------- Notification inside Nav Bar ---------- */
nav.tabs{grid-template-columns:repeat(5,1fr)!important}
.tab.nav-bell{position:relative;background:none;border:0;font:inherit;cursor:pointer}
.tab-ic{position:relative;display:grid;place-items:center;line-height:0}
.tab-ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab-ic .badge{position:absolute;top:-7px;right:-11px;min-width:18px;height:18px;padding:0 4px;line-height:18px}
.tab.nav-bell[aria-expanded="true"]{color:var(--accent);font-weight:700}
/* Panel - mobile e nav bar er upore, PC te nav bar er niche */

@media (min-width:720px){
  nav.tabs{grid-template-columns:repeat(5,auto)!important}

  .tab.nav-bell{flex-direction:row!important;gap:8px!important;font-size:.92rem!important;padding:10px 14px!important}
}


/* ---------- Notification inside 3 dots ---------- */
.dots-btn{position:relative}
.dots-badge{position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--surface);display:block}
.dots-badge[hidden]{display:none}
.dots-menu button{position:relative}
.dots-menu .badge{position:absolute;right:12px;top:50%;transform:translateY(-50%);min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--bad);color:var(--surface);font-size:.72rem;font-weight:700;line-height:19px;text-align:center}
.dots-menu .badge[hidden]{display:none}


/* ---------- Professional hover - design / color same, sudhu interaction ---------- */
.btn,.tab,.chip,.tcard,.dots-btn,.dots-menu button,.fab-btn,.fab-item,.theme-switch,.mem-upload-label,.toc a,summary,.subtabs .chip{transition:background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease,transform .25s ease}
.tab{position:relative}
.tab::after{content:"";position:absolute;left:50%;bottom:2px;width:0;height:2px;border-radius:2px;background:var(--accent);transition:width .25s ease,left .25s ease}
@media (hover:hover) and (pointer:fine){
  /* Buttons - primary theme er ektu garo / ujjol shade */
  .btn:hover{background:var(--surface2);border-color:var(--accent);color:var(--ink);transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--accent-ink);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.10)}
  .btn.danger:hover{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
  .btn.ghost:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.7)}
  .hero .btn.primary:hover{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
  /* Links */
  a:not(.btn):not(.tab):not(.toc a):hover{color:var(--accent-hover);text-decoration:underline}
  /* Nav menu - soft bg + underline */
  .tab:hover{background:var(--accent-soft);color:var(--accent)}
  .tab:hover::after{width:56%;left:22%}
  .tab[aria-current="page"]:hover{background:var(--accent-soft);color:var(--accent)}
  /* Service card - samanno upore + subtle shadow */
  .tcard:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.08);border-color:var(--accent)!important}
  .tcard:hover .tarrow{transform:translateX(2px)}
  .tcard .tarrow{transition:transform .25s ease}
  /* Chips / subtabs */
  .chip:hover,.subtabs .chip:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .chip[aria-pressed="true"]:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--accent-ink)}
  /* Dots menu + header */
  .dots-btn:hover{background:var(--accent-soft);border-color:var(--accent)}
  .dots-menu button:hover{background:var(--accent-soft);color:var(--ink)}
  .theme-switch:hover{border-color:var(--accent)}
  /* Floating Call / WhatsApp */
  .fab-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .fab-item:hover{background:var(--accent-soft)}
  /* TOC / summary / upload */
  .toc a:hover{background:var(--accent-soft)}
  summary:hover{color:var(--accent)}
  .mem-upload-label:hover{background:var(--accent-soft);border-color:var(--accent)}
}
@media (prefers-reduced-motion:reduce){
  .btn,.tab,.chip,.tcard,.dots-btn,.dots-menu button,.fab-btn,.fab-item,.theme-switch,.mem-upload-label,.toc a,summary{transition:none}
  .tab::after{transition:none}
}

function initSig(){
  var c=document.getElementById('sig');if(!c)return;
  var r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1,ctx=c.getContext('2d');
  c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);ctx.scale(dpr,dpr);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height);
  ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
  if(draft.sig){var img=new Image();img.onload=function(){ctx.drawImage(img,0,0,r.width,r.height);};img.src=draft.sig;}
  var drawing=false,last=null;
  function pos(e){var b=c.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top};}
  c.addEventListener('pointerdown',function(e){drawing=true;try{c.setPointerCapture(e.pointerId);}catch(x){}last=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.1,last.y+.1);ctx.stroke();e.preventDefault();});
  c.addEventListener('pointermove',function(e){if(!drawing)return;var q=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();last=q;e.preventDefault();});
  function end(){if(!drawing)return;drawing=false;draft.sig=c.toDataURL('image/png');if(errs.sig){delete errs.sig;var er=c.parentNode.parentNode.querySelector('.err');if(er)er.remove();}}
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}

function validate(){
  var e={},d=draft;
  function need(k,msg){if(!String(d[k]||'').trim())e[k]=msg;}
  if(step===1){
    need('name','নাম লিখুন।');need('father','পিতা বা স্বামীর নাম লিখুন।');need('mother','মাতার নাম লিখুন।');
    if(!d.dob)e.dob='জন্মতারিখ দিন।';
    if(!/^(\d{10}|\d{13}|\d{17})$/.test(toEn(d.nid)))e.nid='10, 13 বা 17 অঙ্কের নম্বর দিন।';
    need('occupation','পেশা লিখুন।');
    if(!/^01[3-9]\d{8}$/.test(toEn(d.phone)))e.phone='সঠিক মোবাইল নম্বর দিন (যেমন 01712345678)।';
    if(!/^\d+$/.test(toEn(d.income)))e.income='মাসিক আয় সংখ্যায় লিখুন।';
  }else if(step===2){
    need('pv','গ্রামের নাম লিখুন।');need('pp','ডাকঘরের নাম লিখুন।');need('pu','উপজেলার নাম লিখুন।');need('pd','জেলার নাম লিখুন।');
    if(!d.same){need('tv','গ্রামের নাম লিখুন।');need('tp','ডাকঘরের নাম লিখুন।');need('tu','উপজেলার নাম লিখুন।');need('td','জেলার নাম লিখুন।');}
  }else if(step===3){
    if(!(Number(toEn(d.amount))>=1000))e.amount='কমপক্ষে 1,000 টাকা লিখুন।';
    need('purpose','অর্থ গ্রহণের উদ্দেশ্য লিখুন।');need('usage','অর্থ কীভাবে ব্যবহার করবেন লিখুন।');
    var m=parseInt(toEn(d.months),10);if(!(m>=1&&m<=36))e.months='1 থেকে 36 মাসের মধ্যে লিখুন।';
    if(d.method==='অন্যান্য')need('methodOther','পদ্ধতিটি লিখুন।');
    need('gname','জামানতদারের নাম লিখুন।');
    if(!/^01[3-9]\d{8}$/.test(toEn(d.gphone)))e.gphone='জামানতদারের সঠিক মোবাইল নম্বর দিন।';
    need('grel','জামানতদারের সাথে সম্পর্ক লিখুন।');
    if(!/^(\d{10}|\d{13}|\d{17})$/.test(toEn(d.gnid)))e.gnid='জামানতদারের 10, 13 বা 17 অঙ্কের NID দিন।';
    if(d.cheque!=='হ্যাঁ')e.cheque='ব্যাংক চেক লাগবে। ব্যাংক চেক দিতে পারলে হ্যাঁ দিন।';
  }else{
    if(!d.agree)e.agree='জমা দিতে ঘোষণায় টিক দিন।';
    if(!d.sig)e.sig='আঙুল দিয়ে স্বাক্ষর করুন।';
  }
  errs=e;return Object.keys(e).length===0;
}
function submitApp(){

  var pres={v:d.pv.trim(),p:d.pp.trim(),u:d.pu.trim(),d:d.pd.trim()};
  var a={id:'A'+S.nextApp,no:no,name:d.name.trim(),father:d.father.trim(),mother:d.mother.trim(),dob:d.dob,nid:toEn(d.nid),occupation:d.occupation.trim(),phone:toEn(d.phone),income:toEn(d.income),
    present:pres,perm:d.same?pres:{v:d.tv.trim(),p:d.tp.trim(),u:d.tu.trim(),d:d.td.trim()},
    amount:Number(toEn(d.amount)),type:d.type,purpose:d.purpose.trim(),usage:d.usage.trim(),months:parseInt(toEn(d.months),10),method:d.method,methodOther:d.methodOther.trim(),prev:d.prev,gname:d.gname.trim(),gphone:toEn(d.gphone),grel:d.grel.trim(),gnid:toEn(d.gnid),cheque:d.cheque,
    sig:d.sig,signedOn:todayStr(),status:'submitted',note:'',createdAt:todayStr()};
  S.nextApp++;S.apps.unshift(a);save();lastApp=a;draft=blankDraft();if(user){draft.name=user.name;draft.phone=user.phone;}step=1;errs={};
}

/* ---------- Beneficiaries ---------- */
var benYear='all';
function viewBen(){
  var loans=S.loans.map(function(l,i){return {l:l,idx:i};}).sort(function(a,b){return b.l.disbursed<a.l.disbursed?-1:1;});
  var years=[];S.loans.forEach(function(l){var y=l.disbursed.slice(0,4);if(years.indexOf(y)<0)years.push(y);});years.sort().reverse();
  var list=loans.filter(function(x){return benYear==='all'||x.l.disbursed.slice(0,4)===benYear;});
  var sum=list.reduce(function(a,x){return a+x.l.amount;},0);
  var chips='<div class="chips"><button class="chip" data-a="year" data-v="all" aria-pressed="'+(benYear==='all')+'">সব বছর</button>'+years.map(function(y){return '<button class="chip" data-a="year" data-v="'+y+'" aria-pressed="'+(benYear===y)+'">'+bn(y)+'</button>';}).join('')+'</div>';
  var cards=list.map(function(x){
    var l=x.l,named=l.consent;
    return '<div class="card row"><div class="avatar'+(named?'':' anon')+'">'+(named?esc(initial(l.name)):'#')+'</div><div class="grow"><b>'+(named?esc(l.name):'সুবিধাভোগী #'+bn(x.idx+1))+'</b><div class="small muted">'+fmtDate(l.disbursed)+'</div></div><div class="amt">'+money(l.amount)+'</div></div>';
  }).join('')||'<p class="muted">এই বছরে কোনো বিতরণ নেই।</p>';
  return '<h2>সুবিধাভোগীদের তালিকা</h2>'+chips+'<p class="muted">'+bn(list.length)+' জনকে মোট '+money(sum)+' দেওয়া হয়েছে।</p><div class="stack tight">'+cards+'</div>'+
    '<p class="small muted">যাঁরা প্রকাশে সম্মতি দিয়েছেন, শুধু তাঁদের নামই দেখানো হয়। অন্যদের পরিচয় গোপন রেখে শুধু অঙ্ক দেখানো হয়।</p>';
}

  '<a href="#nasihat" data-a="nasihatGoto" data-v="nasihat-2"><span class="toc-num">2</span><span>হাদিস</span><span class="toc-arrow">↓</span></a>'+

  '</nav></section>'+
  '<section class="card stack nasihat-sec" id="nasihat-1"><h3><span class="sec-num">1</span> কুরআনের আয়াত</h3>'+
  '<p>আল্লাহ তাআলা বলেন,</p>'+
  '<blockquote class="nasihat-quote">“কে সে ব্যক্তি, যে আল্লাহকে উত্তম ঋণ দেবে? তাহলে তিনি তার জন্য তা বহুগুণ বৃদ্ধি করবেন।”<footer>— সূরা আল-বাকারা, আয়াত: 245</footer></blockquote>'+
  '<p>কর্জে হাসানা অর্থ হলো আল্লাহর সন্তুষ্টির উদ্দেশ্যে প্রয়োজনগ্রস্ত মানুষকে সুদমুক্ত ঋণ দিয়ে সহযোগিতা করা। একজন মানুষের কঠিন সময়ে পাশে দাঁড়ানো এবং তাকে নিজের প্রয়োজন পূরণ করার সুযোগ করে দেওয়া একটি মহৎ কাজ।</p>'+
  '<p>আল্লাহ তাআলা আরও বলেন,</p>'+
  '<blockquote class="nasihat-quote">“আল্লাহ ব্যবসাকে হালাল করেছেন এবং সুদকে হারাম করেছেন।”<footer>— সূরা আল-বাকারা, আয়াত: 275</footer></blockquote>'+
  '<p>ইসলাম বৈধ ব্যবসা ও ন্যায়সংগত লেনদেনকে অনুমোদন করেছে এবং সুদকে স্পষ্টভাবে নিষিদ্ধ করেছে। তাই আমাদের উচিত হালাল উপার্জনের পথ বেছে নেওয়া এবং সুদ থেকে নিজেদের দূরে রাখা। একই সঙ্গে প্রয়োজনগ্রস্ত মানুষের পাশে সুদমুক্ত সহযোগিতার হাত বাড়িয়ে দেওয়া ইসলামের একটি সুন্দর শিক্ষা।</p>'+
  '<p>আল হাসানা ফাউন্ডেশন এই শিক্ষাকে সামনে রেখে প্রকৃত আর্থিকভাবে অসচ্ছল ও প্রয়োজনগ্রস্ত মানুষের জন্য সুদমুক্ত কর্জে হাসানার মাধ্যমে সহযোগিতা করতে চায়।</p></section>'+
  '<section class="card stack nasihat-sec" id="nasihat-2"><h3><span class="sec-num">2</span> হাদিস</h3>'+
  '<p>রাসুলুল্লাহ ﷺ বলেছেন,</p>'+
  '<blockquote class="nasihat-quote">“যে ব্যক্তি কোনো মুমিনের দুনিয়ার একটি কষ্ট দূর করে দেয়, আল্লাহ কিয়ামতের দিন তার একটি কষ্ট দূর করে দেবেন।”<footer>— সহিহ মুসলিম, হাদিস: 2699</footer></blockquote>'+
  '<p>মানুষের প্রয়োজনের সময়ে পাশে দাঁড়ানো ইসলামের অন্যতম সুন্দর শিক্ষা। একজন মানুষের আর্থিক সংকট কিংবা কঠিন সময়ে সামর্থ্য অনুযায়ী সহযোগিতা করা তার জন্য স্বস্তির কারণ হতে পারে। কর্জে হাসানার মাধ্যমে একজন প্রয়োজনগ্রস্ত মানুষ সুদের বোঝা ছাড়াই নিজের প্রয়োজন পূরণের সুযোগ পেতে পারে।</p>'+
  '<p>অন্যদিকে সুদ সম্পর্কে ইসলামে অত্যন্ত কঠোর সতর্কতা এসেছে। রাসুলুল্লাহ ﷺ সুদের গ্রহীতা, সুদদাতা, সুদের লেনদেনের লেখক এবং এর সাক্ষী—সকলের ব্যাপারে সতর্ক করেছেন এবং বলেছেন,</p>'+
  '<blockquote class="nasihat-quote">“তারা সবাই সমান।”<footer>— সহিহ মুসলিম, হাদিস: 1598</footer></blockquote>'+
  '<p>সুদের লেনদেন শুধু ব্যক্তিগত ক্ষতির বিষয় নয়; এটি সমাজের অর্থনৈতিক ভারসাম্য ও পারস্পরিক সহযোগিতার ওপরও নেতিবাচক প্রভাব ফেলতে পারে। তাই একজন মুসলমানের উচিত সুদ থেকে নিজেকে বাঁচানো এবং হালাল উপার্জন ও ন্যায়সংগত লেনদেনের পথ বেছে নেওয়া।</p>'+
  '<p>কর্জে হাসানা এর বিপরীতে মানুষের প্রয়োজনের সময়ে সুদমুক্ত সহযোগিতার একটি সুন্দর মাধ্যম। একজনের প্রয়োজন পূরণে দেওয়া অর্থ যখন পরবর্তীতে ফেরত আসে, তখন তা আবার অন্য একজন প্রয়োজনগ্রস্ত মানুষের কাজে ব্যবহার করা সম্ভব হয়। এভাবে সহযোগিতার একটি ধারাবাহিকতা তৈরি হতে পারে।</p></section>'+
  '<section class="card stack nasihat-sec" id="nasihat-3"><h3><span class="sec-num">3</span> সদকা ও মানবসেবা</h3>'+
  '<p>আল্লাহ তাআলা বলেন,</p>'+

function readMemPhoto(file,cb){
  if(!file){cb('');return;}
  if(file.type && file.type.indexOf('image/')!==0){toast('ছবি ফাইল দিন।');cb('');return;}
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      try{
        var max=400;var w=img.width,h=img.height;if(w>max||h>max){var sc=Math.min(max/w,max/h);w=Math.round(w*sc);h=Math.round(h*sc);}
        var cv=document.createElement('canvas');cv.width=w;cv.height=h;var cx=cv.getContext('2d');cx.drawImage(img,0,0,w,h);
        cb(cv.toDataURL('image/jpeg',0.85));
      }catch(e){cb(rd.result);}
    };
    img.onerror=function(){cb(rd.result);};
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

  var slides=l.ins.map(function(i,k){

    else if(i.due<t){var dd=dayDiff(i.due,t);cls='overdue';stat='<span class="pill red">বকেয়া</span>';note=bn(dd)+' দিন আগে দেওয়ার কথা ছিল';}

  }).join('');
  var car='<h3>কিস্তির সময়সূচি</h3><div class="slides" id="slides" data-first="'+Math.max(firstIdx,0)+'" tabindex="0" aria-label="কিস্তির তালিকা, পাশে সরিয়ে দেখুন">'+slides+'</div>'+
    '<div class="row" style="justify-content:center;gap:16px"><button class="btn sm" data-a="slprev" aria-label="আগের কিস্তি">\u2190</button><span class="amt" id="sl-count" style="min-width:4.5em;text-align:center"></span><button class="btn sm" data-a="slnext" aria-label="পরের কিস্তি">\u2192</button></div>';
  return '<h2>আমার ঋণ</h2>'+myLoanHead()+sum+dues+car;
}

    '<dt>কিস্তি</dt><dd>'+bn(Number(idx)+1)+' / '+bn(l.n)+'</dd><dt>কিস্তির পরিমাণ</dt><dd>'+money(inst.amt)+'</dd>'+

function render(){
  var gated=LOGIN_ENABLED&&!user;
  document.body.classList.toggle('gating',gated);
  document.getElementById('gate').hidden=!gated;
  document.querySelector('header.top').hidden=gated;
  document.getElementById('nav').hidden=gated;
  document.querySelector('main').hidden=gated;
  if(gated){renderGate();return;}
  renderNav();
  var _sw=document.getElementById('themeSwitch');if(_sw)_sw.setAttribute('aria-checked',document.documentElement.getAttribute('data-theme')==='dark'?'true':'false');
  document.getElementById('app').innerHTML=VIEWS[route]();
  if(window._dotsTarget){var _dt=window._dotsTarget;window._dotsTarget=null;setTimeout(function(){var _de=document.getElementById(_dt);if(_de)_de.scrollIntoView({behavior:'smooth',block:'start'});},100);}
  if(route==='myloan'){initSlides();}
  if(route==='apply'&&step===4&&!lastApp)initSig();
  if(route==='apply'&&step===2&&!lastApp)updPreview();
}

  var el=e.target.closest('[data-a]');if(!el||el.type==='checkbox')return;
  var a=el.dataset.a,id=el.dataset.id,t=todayStr();
  if(a!=='del'&&a!=='reset')pending=null;
  switch(a){
    case 'ulogout':user=null;myLoanAuth=null;myLoanErr='';try{sessionStorage.removeItem('ahf-user');sessionStorage.removeItem('ahf-myloan');}catch(x){}authed=false;gs=newGate();render();window.scrollTo(0,0);break;
    case 'myloan-logout':myLoanAuth=null;myLoanErr='';myLoanPhone='';myLoanNo='';pending=null;try{sessionStorage.removeItem('ahf-myloan');}catch(x){}render();window.scrollTo(0,0);toast('আপনি বের হয়ে গেছেন।');break;
    case 'gback':gs.step=1;gs.err={};renderGate();break;
    case 'gresend':if(Date.now()-gs.sentAt>=30000){gs.code=newCode();gs.sentAt=Date.now();toast('নতুন কোড পাঠানো হয়েছে');renderGate();}break;
    case 'sigclear':draft.sig='';render();break;
    case 'pickloan':myLoanId=el.dataset.v||null;render();break;
    case 'slprev':var sc=document.getElementById('slides');if(sc)slideTo(Math.max(0,curSlide(sc)-1),true);break;
    case 'slnext':var sn=document.getElementById('slides');if(sn)slideTo(Math.min(sn.children.length-1,curSlide(sn)+1),true);break;
    case 'tdetail':typeOpen=Number(el.dataset.v);renderSheet();break;
    case 'tclose':typeOpen=-1;renderSheet();break;
    case 'loantype':typeOpen=-1;renderSheet();draft.type=el.dataset.v;lastApp=null;step=1;location.hash='#apply';break;
    case 'applyGeneral':lastApp=null;step=1;location.hash='#apply';break;
    case 'nasihatGoto':var _ng=document.getElementById(el.dataset.v);if(_ng)_ng.scrollIntoView({behavior:'smooth',block:'start'});break;
    case 'dotsMenu':var _dm=document.getElementById('dotsMenu');var _db=document.getElementById('dotsBtn');if(_dm){var _o=_dm.hidden;_dm.hidden=!_o;if(_db)_db.setAttribute('aria-expanded',_o?'true':'false');}break;
    case 'memPhotoRemove':var _mr=S.committee.find(function(x){return x.id===id;});if(_mr){_mr.photo='';save();render();toast('ছবি বাদ দেওয়া হয়েছে।');}break;
    case 'dotsGo':var _tgt='sec-'+el.dataset.v;var _dm2=document.getElementById('dotsMenu');if(_dm2)_dm2.hidden=true;var _db2=document.getElementById('dotsBtn');if(_db2)_db2.setAttribute('aria-expanded','false');if(route!=='home'){window._dotsTarget=_tgt;location.hash='#home';}else{var _el=document.getElementById(_tgt);if(_el)_el.scrollIntoView({behavior:'smooth',block:'start'});}break;
    case 'fabToggle':var _fm=document.getElementById('fabMenu');var _fb=document.getElementById('fabBtn');if(_fm&&_fb){var _open=_fm.hidden;_fm.hidden=!_open;_fb.setAttribute('aria-expanded',_open?'true':'false');_fb.innerHTML=_open?'✕':'<svg viewBox="0 0 24 24" width="24" height="24" fill="#fff" aria-hidden="true"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>';}break;
    case 'theme':var _cur=document.documentElement.getAttribute('data-theme');var _nxt=_cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',_nxt);try{localStorage.setItem('ahf-theme',_nxt);}catch(e){}el.setAttribute('aria-checked',_nxt==='dark'?'true':'false');break;
    case 'receipt':showReceipt(id,el.dataset.idx);break;
    case 'printReceipt':window.print();break;
    case 'closeReceipt':var _rp=document.getElementById('receipt-print');if(_rp){_rp.hidden=true;_rp.innerHTML='';}break;
    case 'bell':var _dmB=document.getElementById('dotsMenu');if(_dmB)_dmB.hidden=true;var _dbB=document.getElementById('dotsBtn');if(_dbB)_dbB.setAttribute('aria-expanded','false');if(panelOpen)closePanel();else openPanel();break;
    case 'next':if(validate()){step++;window.scrollTo(0,0);}render();break;
    case 'back':step--;errs={};window.scrollTo(0,0);render();break;
    case 'submit':if(validate()){submitApp();window.scrollTo(0,0);}render();break;
    case 'newapp':lastApp=null;lookupHtml='';step=1;render();break;
    case 'year':benYear=el.dataset.v;render();break;
    case 'logout':authed=false;pending=null;render();toast('অ্যাডমিন থেকে বের হয়ে গেছেন।');break;
    case 'atab':adminTab=el.dataset.v;render();break;
    case 'review':var ra=findApp(id);ra.status='under_review';var n1=document.getElementById('note-'+id);if(n1)ra.note=n1.value;save();toast('যাচাই শুরু হয়েছে');render();break;
    case 'reject':var rj=findApp(id);var n2=document.getElementById('note-'+id);rj.note=n2?n2.value:'';rj.status='rejected';save();toast('আবেদন বাতিল হয়েছে');render();break;
    case 'approve':
      var ap=findApp(id);var n3=document.getElementById('note-'+id);ap.note=n3?n3.value:'';ap.status='approved';
      S.loans.push({id:'L'+Date.now(),appNo:ap.no,name:ap.name,phone:toWa(ap.wa||ap.phone),amount:ap.amount,n:ap.months,disbursed:t,ins:schedule(ap.amount,ap.months,addMonths(t,1)),consent:false});
      save();toast('অনুমোদিত। কিস্তির সময়সূচি তৈরি হয়েছে।');render();break;
    case 'payin':
      var ln=findLoan(id),nx=nextUnpaid(ln);if(nx){nx.paidOn=t;nx.method=document.getElementById('m-'+id).value;var _tx=document.getElementById('txn-'+id);if(_tx)nx.txn=_tx.value.trim();save();toast(money(nx.amt)+' আদায় এন্ট্রি হয়েছে');}render();break;
    case 'del':
      var key=el.dataset.k+id;
      if(pending!==key){pending=key;render();return;}
      if(el.dataset.k==='don')S.donations=S.donations.filter(function(d){return d.id!==id;});
      else if(el.dataset.k==='noti'){delNoti(id);}
      else S.committee=S.committee.filter(function(m){return m.id!==id;});
      pending=null;save();toast('মুছে ফেলা হয়েছে');render();break;
    case 'reset':
      if(pending!=='reset'){pending='reset';render();return;}
      S=seed();save();pending=null;toast('ডেমো ডেটা ফিরে এসেছে');render();break;
  }
});
document.addEventListener('change',function(e){

    readMemPhoto(el.files[0],function(url){
      if(!url)return;
      window._newMemPhoto=url;
      var pv=document.getElementById('m-photo-preview');if(pv)pv.innerHTML='<img src="'+url+'" alt="নতুন সদস্যের ছবি">';
      toast('ছবি বেছে নেওয়া হয়েছে।');
    });
    return;
  }
  if(el.dataset&&el.dataset.a==='memPhoto'&&el.files&&el.files[0]){
    (function(_id,_file){
      readMemPhoto(_file,function(url){
        if(!url)return;

        if(mm){mm.photo=url;save();render();toast('ছবি বদলে গেছে।');}
      });
    })(el.dataset.id,el.files[0]);

  }

document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.f){draft[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;if(errs[el.dataset.f]){delete errs[el.dataset.f];var p=el.parentNode.querySelector('.err');if(!p){var lb=el.closest('label');if(lb&&lb.nextElementSibling&&lb.nextElementSibling.classList.contains('err'))p=lb.nextElementSibling;}if(p)p.remove();}if(el.dataset.f==='amount'||el.dataset.f==='months')updPreview();if(el.dataset.f==='method'||el.dataset.f==='same'){render();}}

document.addEventListener('submit',function(e){
  var f=e.target.dataset.form;if(!f)return;e.preventDefault();
  if(f==='g1'){
    gs.name=document.getElementById('g-name').value;gs.phone=document.getElementById('g-phone').value;gs.err={};
    if(gs.name.trim().length<2)gs.err.name='আপনার নাম লিখুন।';
    if(!/^01[3-9]\d{8}$/.test(toEn(gs.phone)))gs.err.phone='সঠিক মোবাইল নম্বর দিন (যেমন 01712345678)।';
    if(Object.keys(gs.err).length){renderGate();var fe=document.getElementById(gs.err.name?'g-name':'g-phone');if(fe)fe.focus();return;}
    gs.step=2;gs.code=newCode();gs.sentAt=Date.now();renderGate();var ci=document.getElementById('g-code');if(ci)ci.focus();return;
  }
  if(f==='g2'){
    var c=toEn(document.getElementById('g-code').value);
    if(c!==gs.code){gs.err={code:'কোড ঠিক নয়। আবার চেষ্টা করুন।'};renderGate();var cf=document.getElementById('g-code');if(cf)cf.focus();return;}
    user={name:gs.name.trim(),phone:toEn(gs.phone)};
    try{sessionStorage.setItem('ahf-user',JSON.stringify(user));}catch(x){}
    if(!draft.name)draft.name=user.name;if(!draft.phone)draft.phone=user.phone;
    gs=newGate();render();window.scrollTo(0,0);toast('স্বাগতম, '+user.name);return;
  }
  if(f==='nsend'){
    var nt=document.getElementById('n-title').value.trim(),nb=document.getElementById('n-body').value.trim();
    if(!nt){toast('শিরোনাম লিখুন।');return;}
    if(!dbRef){toast('লাইভ সংযোগ নেই, পাঠানো যায়নি।');return;}
    dbRef.collection('notifications').add({title:nt,body:nb,createdAt:Date.now()}).then(function(){document.getElementById('n-title').value='';document.getElementById('n-body').value='';toast('নোটিফিকেশন পাঠানো হয়েছে');}).catch(function(){toast('পাঠানো যায়নি। অনুমতি নেই।');});
    return;
  }
  if(f==='myloan-login'){
    var mlPh=toEn(document.getElementById('ml-phone').value);
    var mlNo=document.getElementById('ml-no').value.trim().toUpperCase();
    myLoanPhone=mlPh;myLoanNo=mlNo;myLoanErr='';pending=null;
    if(!/^01[3-9]\d{8}$/.test(mlPh)){myLoanErr='সঠিক মোবাইল নম্বর দিন (যেমন 01712345678)।';render();return;}
    if(!mlNo){myLoanErr='আবেদন নম্বর দিন। যেমন AHF-2026-001।';render();return;}
    var fApp=S.apps.find(function(x){return String(x.no||'').toUpperCase()===mlNo&&toEn(x.phone)===mlPh;});
    var fLoan=S.loans.find(function(x){return x.appNo&&String(x.appNo).toUpperCase()===mlNo&&toWa(x.phone)===toWa(mlPh);});
    if(!fApp&&!fLoan){myLoanErr='এই মোবাইল ও আবেদন নম্বর দিয়ে কিছু পাওয়া যায়নি। নম্বর দুটি আবার মিলিয়ে দেখুন।';render();return;}
    var fName=fApp?fApp.name:(fLoan?fLoan.name:'');
    myLoanAuth={name:fName,phone:mlPh,appNo:mlNo};
    try{sessionStorage.setItem('ahf-myloan',JSON.stringify(myLoanAuth));}catch(x){}
    myLoanErr='';render();window.scrollTo(0,0);toast('স্বাগতম, '+fName);return;
  }
  if(f==='pin'){if(toEn(document.getElementById('pin').value)==='1234'){authed=true;render();}else{document.getElementById('pin-err').hidden=false;}}
  else if(f==='lookup'){
    var no=document.getElementById('l-no').value.trim().toUpperCase(),ph=toEn(document.getElementById('l-ph').value);
    var a=S.apps.find(function(x){return x.no===no&&x.phone===ph;});
    lookupHtml=a?'<div class="card" style="background:var(--surface2);border-color:transparent"><div class="row" style="justify-content:space-between"><b>'+esc(a.name)+'</b>'+pill(a.status)+'</div><p class="small muted">'+money(a.amount)+' · জমা '+fmtDate(a.createdAt)+'</p>'+(a.note?'<p class="small"><b>কমিটির মন্তব্য:</b> '+esc(a.note)+'</p>':'')+'</div>':'<p class="err">এই নম্বর ও মোবাইল দিয়ে কোনো আবেদন পাওয়া যায়নি।</p>';
    render();
  }
  else if(f==='don'){
    var amt=Number(toEn(document.getElementById('d-amt').value));
    if(amt>0){S.donations.unshift({id:'D'+Date.now(),amt:amt,on:todayStr(),note:document.getElementById('d-note').value.trim()});save();toast('অনুদান যোগ হয়েছে');render();}
  }
  else if(f==='mem'){
    var nm=document.getElementById('m-name').value.trim(),rl=document.getElementById('m-role').value.trim();
    if(nm&&rl){S.committee.push({id:'M'+Date.now(),name:nm,role:rl,phone:toEn(document.getElementById('m-phone').value),photo:window._newMemPhoto||''});window._newMemPhoto='';save();toast('সদস্য যোগ হয়েছে');render();}
  }
});
